<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="page-container">
        <article class="profile-card" data-testid="test-profile-card">
            <header class="profile-header">
                <figure class="avatar-wrapper">
                    <img src="/images/raphOye.jpeg" alt="Portrait of Oyeniyi Raphael" data-testid="test-user-avatar">
                    <figcaption class="sr-only">User avatar for Oyeniyi Raphael</figcaption>
                </figure>

                <div class="profile-summary">
                    <h2 class="profile-name" data-testid="test-user-name">Oyeniyi Raphael</h2>
                    <p class="profile-bio" data-testid="test-user-bio">
                        Front-end developer passionate about building accessible, clean interfaces that feel intuitive on every device.
                    </p>
                    <div class="time-container">
                        <span class="time-label">Current time</span>
                        <time id="user-time" class="user-time" data-testid="test-user-time" aria-live="polite"></time>
                    </div>
                </div>
            </header>

            <nav class="social-links" data-testid="test-user-social-links" aria-label="Social links">
                <ul>
                    <li><a href="https://twitter.com" target="_blank" rel="noopener noreferrer" data-testid="test-user-social-twitter">Twitter</a></li>
                    <li><a href="https://www.linkedin.com/in/raphael-oyeniyi/" target="_blank" rel="noopener noreferrer" data-testid="test-user-social-linkedin">LinkedIn</a></li>
                    <li><a href="https://github.com/ralphoye" target="_blank" rel="noopener noreferrer" data-testid="test-user-social-github">GitHub</a></li>
                </ul>
            </nav>

            <section class="profile-lists">
                <section class="list-section">
                    <h3>Hobbies</h3>
                    <ul class="item-list" data-testid="test-user-hobbies">
                        <li>Coding</li>
                        <li>Hiking</li>
                        <li>Cooking</li>
                    </ul>
                </section>

                <section class="list-section">
                    <h3>Dislikes</h3>
                    <ul class="item-list" data-testid="test-user-dislikes">
                        <li>Slow internet</li>
                        <li>Unclear UI</li>
                        <li>Poor contrast</li>
                    </ul>
                </section>
            </section>
        </article>
    </main>

    <script src="script.js"></script>
</body>
</html>
